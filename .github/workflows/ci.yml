# Integración continua del backend (ADR-019, propuesta para ratificación).
# - push a ramas de trabajo: validación rápida (nunca fusiona).
# - pull_request hacia develop/main: puerta completa; los checks requeridos siempre reportan estado.
# Los pasos invocan los mismos comandos documentados en README (scripts/task.py).
# Sin acceso a GCP: no se autentica, no publica imágenes y no despliega. Las imágenes se
# construyen en el runner solo para comprobarlas.
name: ci

on:
  push:
    branches: ["feature/**", "fix/**", "chore/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python scripts/task.py lock-check
      - run: uv run python scripts/task.py format-check
      - run: uv run python scripts/task.py lint
      - run: uv run python scripts/task.py typecheck
      - name: Manifiestos Kubernetes (kustomize por digest, sin clúster)
        run: |
          uv run python scripts/task.py k8s-render --use-example --engine docker
          uv run python scripts/release.py k8s-check reports/k8s/base.yaml
          uv run python scripts/release.py k8s-check reports/k8s/local.yaml --allowed-tag local

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python scripts/task.py test unit

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --no-project python scripts/task.py secrets --mode git

  # ------------------------------------------------------------ solo pull request

  integration-coverage:
    name: integration-coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      PUBSUB_EMULATOR_HOST: 127.0.0.1:58085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Emulador de Pub/Sub
        run: uv run python scripts/task.py pubsub-up
      - run: uv run python scripts/task.py coverage-erase
      - run: uv run python scripts/task.py test unit
      - run: uv run python scripts/task.py test integration
      - run: uv run python scripts/task.py test contract
      - run: uv run python scripts/task.py test component
      - name: Cobertura consolidada (umbral 80 %)
        run: uv run python scripts/task.py coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: reports/coverage/coverage.xml
          retention-days: 30
          if-no-files-found: warn

  security:
    name: security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python scripts/task.py security

  image:
    name: image (${{ matrix.component }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component:
          - users-management
          - affiliation-management
          - complementary-services
          - training-management
          - events-management
          - third-party-management
          - bff-web
          - bff-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Construir imagen (sin publicar)
        run: >-
          uv run --no-project python scripts/task.py build ${{ matrix.component }}
          --tag pr-${{ github.event.pull_request.number }}
          --revision ${{ github.sha }}
