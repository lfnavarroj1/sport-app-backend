# Validación de una release publicada en GitHub (sin acceso a GCP).
# - Comprueba que el tag sea SemVer (vX.Y.Z o vX.Y.Z-pre) y que su commit pertenezca a main.
# - Ejecuta calidad, seguridad, secretos y las cuatro suites con el umbral de cobertura.
# - Construye y prueba las ocho imágenes en el runner, sin publicarlas.
# - Deja como artefacto backend-validation.json (versión, commit, contratos y componentes).
# No se autentica contra GCP, no publica imágenes y no despliega: la construcción publicada la
# hace Cloud Build (cloudbuild.release.yaml), iniciado desde GCP por sport-app-platform.
name: release-validation

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.13"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.release_tag }}
      version: ${{ steps.verify.outputs.release_version }}
      commit: ${{ steps.verify.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - id: verify
        name: Tag SemVer y commit dentro de main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run --no-project python scripts/release.py verify
          --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --main-ref origin/main

  quality:
    name: quality
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python scripts/task.py lock-check
      - run: uv run python scripts/task.py format-check
      - run: uv run python scripts/task.py lint
      - run: uv run python scripts/task.py typecheck
      - run: uv run python scripts/task.py security
      - name: Manifiestos Kubernetes (kustomize por digest, sin clúster)
        run: |
          uv run python scripts/task.py k8s-render --use-example --engine docker
          uv run python scripts/release.py k8s-check reports/k8s/base.yaml
          uv run python scripts/release.py k8s-check reports/k8s/local.yaml --allowed-tag local

  secrets:
    name: secrets
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --no-project python scripts/task.py secrets --mode git

  tests:
    name: tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      PUBSUB_EMULATOR_HOST: 127.0.0.1:58085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Emulador de Pub/Sub
        run: uv run python scripts/task.py pubsub-up
      - run: uv run python scripts/task.py coverage-erase
      - name: Suites unit, integration, contract y component
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          for suite in unit integration contract component; do
            uv run python scripts/task.py test "$suite" 2>&1 | tee "dist/tests-$suite.log"
          done
      - name: Cobertura consolidada (umbral de pyproject.toml)
        run: uv run python scripts/task.py coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ needs.verify.outputs.commit }}
          path: |
            dist/tests-*.log
            reports/coverage/coverage.xml
          retention-days: 30
          if-no-files-found: error

  images:
    name: images
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Construir y probar las ocho imágenes (solo locales, sin publicar)
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: >-
          uv run --no-project python scripts/release.py images
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --plan dist/images-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ needs.verify.outputs.commit }}
          path: dist/images-plan.json
          retention-days: 30
          if-no-files-found: error

  evidence:
    name: evidence
    needs: [verify, quality, secrets, tests, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # Registros (dist/) y cobertura (reports/) conservan sus rutas; el plan va a dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-${{ needs.verify.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-${{ needs.verify.outputs.commit }}
          path: dist
      - name: Manifiesto de validación
        run: >-
          uv run --no-project python scripts/release.py manifest --mode validation
          --plan dist/images-plan.json --coverage reports/coverage/coverage.xml
          --test-log unit=dist/tests-unit.log --test-log integration=dist/tests-integration.log
          --test-log contract=dist/tests-contract.log --test-log component=dist/tests-component.log
          --build-system github-actions --build-id "$GITHUB_RUN_ID"
          --output dist/backend-validation.json
      - name: Resumen
        run: |
          {
            echo "## Validación de ${{ needs.verify.outputs.tag }}"
            echo "Commit \`${{ needs.verify.outputs.commit }}\` dentro de \`main\`; imágenes construidas sin publicar."
            echo "La publicación por digest la hace Cloud Build (cloudbuild.release.yaml); el despliegue, sport-app-platform."
            echo '```json'
            cat dist/backend-validation.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-validation-${{ needs.verify.outputs.tag }}
          path: dist/backend-validation.json
          retention-days: 90
          if-no-files-found: error
