title = "SportApp backend"

[extend]
useDefault = true

[allowlist]
description = "Directorios generados o de terceros; no contienen código del repositorio"
paths = [
    '''(^|/)\.venv/''',
    '''(^|/)reports/''',
    # Salidas de scripts/release.py (renders, registros de prueba y manifiestos); ignoradas por Git.
    '''(^|/)dist/''',
    '''(^|/)\.(mypy|ruff)_cache/''',
    '''(^|/)\.git/''',
    '''uv\.lock$''',
]
