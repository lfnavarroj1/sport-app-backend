apiVersion: apps/v1
kind: Deployment
metadata:
  name: affiliation-management
  labels:
    app.kubernetes.io/name: affiliation-management
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: affiliation-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affiliation-management
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: sportapp/affiliation-management
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: AFILIACION_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://afiliacion:$(DB_PASSWORD)@$(DATABASE_HOST):5432/afiliacion"
            # ADR-024: viaja con el release que trae la migración del catálogo. Sin ella, no-ready.
            - name: AFFILIATION_EXPECTED_CATALOG_VERSION
              value: plans-2026-10-11.v1
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # Valores locales iniciales; la capacidad de GKE se fija con experimentos (ADR-011).
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
# Consumidor del alta gratuita (HU001, ADR-024): usuario.registrado.v1 → suscripción FREE.
# Suscripción `sportapp.afiliacion.alta-gratuita.v1`; tópico, DLQ y reintentos los crea
# la plataforma (`T-HU001-PLAT`). Sin endpoint HTTP: Kubernetes lo reinicia si termina.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affiliation-management-free-plan-consumer
  labels:
    app.kubernetes.io/name: affiliation-management-free-plan-consumer
    app.kubernetes.io/component: event-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: affiliation-management-free-plan-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affiliation-management-free-plan-consumer
        app.kubernetes.io/component: event-consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: sportapp/affiliation-management
          imagePullPolicy: IfNotPresent
          command: [python, -m, affiliation_management.workers.free_plan_consumer]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: PUBSUB_PROJECT_ID
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_PROJECT_ID}
            - name: PUBSUB_EMULATOR_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_EMULATOR_HOST, optional: true}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: AFILIACION_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://afiliacion:$(DB_PASSWORD)@$(DATABASE_HOST):5432/afiliacion"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
# afiliacion-outbox-publisher (ADR-024): publica outbox_event en sportapp.afiliacion.v1.
# Publicador de integración, no proyector CQRS. Sin endpoint HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affiliation-management-outbox-publisher
  labels:
    app.kubernetes.io/name: affiliation-management-outbox-publisher
    app.kubernetes.io/component: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: affiliation-management-outbox-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affiliation-management-outbox-publisher
        app.kubernetes.io/component: outbox-publisher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: publisher
          image: sportapp/affiliation-management
          imagePullPolicy: IfNotPresent
          command: [python, -m, affiliation_management.workers.outbox_publisher]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: WORKER_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: PUBSUB_PROJECT_ID
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_PROJECT_ID}
            - name: PUBSUB_EMULATOR_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_EMULATOR_HOST, optional: true}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: AFILIACION_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://afiliacion:$(DB_PASSWORD)@$(DATABASE_HOST):5432/afiliacion"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: affiliation-management
  labels:
    app.kubernetes.io/name: affiliation-management
spec:
  selector:
    app.kubernetes.io/name: affiliation-management
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Migración controlada: se ejecuta como Job, nunca al arrancar las réplicas.
apiVersion: batch/v1
kind: Job
metadata:
  name: affiliation-management-migrate-main
  labels:
    app.kubernetes.io/name: affiliation-management
    app.kubernetes.io/component: migration
spec:
  # Reintenta con espera creciente mientras PostgreSQL termina de iniciar.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affiliation-management
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: sportapp/affiliation-management
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - sportapp_platform.migrations
            - upgrade
            - --script-location
            - affiliation_management.infrastructure.persistence:migrations
            - --url-env
            - DATABASE_URL
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: AFILIACION_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://afiliacion:$(DB_PASSWORD)@$(DATABASE_HOST):5432/afiliacion"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
