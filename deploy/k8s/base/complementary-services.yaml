apiVersion: apps/v1
kind: Deployment
metadata:
  name: complementary-services
  labels:
    app.kubernetes.io/name: complementary-services
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: complementary-services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: complementary-services
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: sportapp/complementary-services
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: SERVICIOS_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://servicios:$(DB_PASSWORD)@$(DATABASE_HOST):5432/servicios"
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # Valores locales iniciales; la capacidad de GKE se fija con experimentos (ADR-011).
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: complementary-services
  labels:
    app.kubernetes.io/name: complementary-services
spec:
  selector:
    app.kubernetes.io/name: complementary-services
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Migración controlada: se ejecuta como Job, nunca al arrancar las réplicas.
apiVersion: batch/v1
kind: Job
metadata:
  name: complementary-services-migrate-main
  labels:
    app.kubernetes.io/name: complementary-services
    app.kubernetes.io/component: migration
spec:
  # Reintenta con espera creciente mientras PostgreSQL termina de iniciar.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: complementary-services
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: sportapp/complementary-services
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - sportapp_platform.migrations
            - upgrade
            - --script-location
            - complementary_services.infrastructure.persistence:migrations
            - --url-env
            - DATABASE_URL
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: SERVICIOS_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://servicios:$(DB_PASSWORD)@$(DATABASE_HOST):5432/servicios"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
