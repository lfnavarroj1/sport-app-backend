apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-management
  labels:
    app.kubernetes.io/name: training-management
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: training-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: training-management
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: sportapp/training-management
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: ENTRENAMIENTOS_DB_PASSWORD}
            - name: DATABASE_WRITE_URL
              value: "postgresql+psycopg://entrenamientos:$(DB_PASSWORD)@$(DATABASE_HOST):5432/entrenamientos_write"
            - name: DATABASE_READ_URL
              value: "postgresql+psycopg://entrenamientos:$(DB_PASSWORD)@$(DATABASE_HOST):5432/entrenamientos_read"
            # HU010: JWKS de Usuarios (identidad) y capacidades del deportista en Afiliación.
            - name: USERS_MANAGEMENT_BASE_URL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: USERS_MANAGEMENT_BASE_URL}
            - name: AFFILIATION_MANAGEMENT_BASE_URL
              value: http://affiliation-management
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # Valores locales iniciales; la capacidad de GKE se fija con experimentos (ADR-011).
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: training-management
  labels:
    app.kubernetes.io/name: training-management
spec:
  selector:
    app.kubernetes.io/name: training-management
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Migración controlada: se ejecuta como Job, nunca al arrancar las réplicas.
apiVersion: batch/v1
kind: Job
metadata:
  name: training-management-migrate-write
  labels:
    app.kubernetes.io/name: training-management
    app.kubernetes.io/component: migration
spec:
  # Reintenta con espera creciente mientras PostgreSQL termina de iniciar.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: training-management
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: sportapp/training-management
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - sportapp_platform.migrations
            - upgrade
            - --script-location
            - training_management.infrastructure.persistence_write:migrations
            - --url-env
            - DATABASE_WRITE_URL
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: ENTRENAMIENTOS_DB_PASSWORD}
            - name: DATABASE_WRITE_URL
              value: "postgresql+psycopg://entrenamientos:$(DB_PASSWORD)@$(DATABASE_HOST):5432/entrenamientos_write"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
