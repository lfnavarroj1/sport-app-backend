apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-management
  labels:
    app.kubernetes.io/name: users-management
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: users-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-management
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: sportapp/users-management
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: USUARIOS_DB_PASSWORD}
            - name: DATABASE_WRITE_URL
              value: "postgresql+psycopg://usuarios:$(DB_PASSWORD)@$(DATABASE_HOST):5432/usuarios_write"
            - name: DATABASE_READ_URL
              value: "postgresql+psycopg://usuarios:$(DB_PASSWORD)@$(DATABASE_HOST):5432/usuarios_read"
            - name: REGISTRATION_POLICIES_VERSION
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: REGISTRATION_POLICIES_VERSION}
            # Obligatoria (HU005, ADR-034): versión vigente del consentimiento de datos de salud.
            - name: HEALTH_DATA_CONSENT_VERSION
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: HEALTH_DATA_CONSENT_VERSION}
            # Obligatoria (HU003): sin clave de firma válida el servicio no arranca.
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: sportapp-users-jwt, key: JWT_PRIVATE_KEY}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # Valores locales iniciales; la capacidad de GKE se fija con experimentos (ADR-011).
          # Argon2id reserva 19 MiB por registro concurrente: la memoria se valida con HA003.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: users-management
  labels:
    app.kubernetes.io/name: users-management
spec:
  selector:
    app.kubernetes.io/name: users-management
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Migración controlada: se ejecuta como Job, nunca al arrancar las réplicas.
apiVersion: batch/v1
kind: Job
metadata:
  name: users-management-migrate-write
  labels:
    app.kubernetes.io/name: users-management
    app.kubernetes.io/component: migration
spec:
  # Reintenta con espera creciente mientras PostgreSQL termina de iniciar.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-management
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: sportapp/users-management
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - sportapp_platform.migrations
            - upgrade
            - --script-location
            - users_management.infrastructure.persistence_write:migrations
            - --url-env
            - DATABASE_WRITE_URL
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: USUARIOS_DB_PASSWORD}
            - name: DATABASE_WRITE_URL
              value: "postgresql+psycopg://usuarios:$(DB_PASSWORD)@$(DATABASE_HOST):5432/usuarios_write"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
