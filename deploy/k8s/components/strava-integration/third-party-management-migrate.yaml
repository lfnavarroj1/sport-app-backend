# Migración controlada de la base `terceros` (`0001_strava_connections`, ADR-042): se ejecuta
# como Job, nunca al arrancar las réplicas. Requiere la base y el usuario `terceros` y la clave
# TERCEROS_DB_PASSWORD de `sportapp-database` (T-HU031-PLAT).
apiVersion: batch/v1
kind: Job
metadata:
  name: third-party-management-migrate-main
  labels:
    app.kubernetes.io/name: third-party-management
    app.kubernetes.io/component: migration
spec:
  # Reintenta con espera creciente mientras PostgreSQL termina de iniciar.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: third-party-management
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: sportapp/third-party-management
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - sportapp_platform.migrations
            - upgrade
            - --script-location
            - third_party_management.infrastructure.persistence:migrations
            - --url-env
            - DATABASE_URL
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: TERCEROS_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://terceros:$(DB_PASSWORD)@$(DATABASE_HOST):5432/terceros"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
