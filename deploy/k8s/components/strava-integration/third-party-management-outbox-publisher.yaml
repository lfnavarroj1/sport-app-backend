# terceros-outbox-publisher (HU031, ADR-042, patrón CMP-002): publica outbox_event en
# sportapp.terceros.v1 con user_id como clave de orden; reintenta de 10 a 600 s y alerta
# desde el décimo fallo. Sin endpoint HTTP. El tópico lo crea la plataforma (T-HU031-PLAT).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: third-party-management-outbox-publisher
  labels:
    app.kubernetes.io/name: third-party-management-outbox-publisher
    app.kubernetes.io/component: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: third-party-management-outbox-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: third-party-management-outbox-publisher
        app.kubernetes.io/component: outbox-publisher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: publisher
          image: sportapp/third-party-management
          imagePullPolicy: IfNotPresent
          command: [python, -m, third_party_management.workers.outbox_publisher]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: APP_ENV}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: LOG_LEVEL}
            - name: WORKER_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: PUBSUB_PROJECT_ID
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_PROJECT_ID}
            - name: PUBSUB_EMULATOR_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: PUBSUB_EMULATOR_HOST, optional: true}
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: {name: sportapp-runtime, key: DATABASE_HOST}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: TERCEROS_DB_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+psycopg://terceros:$(DB_PASSWORD)@$(DATABASE_HOST):5432/terceros"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
