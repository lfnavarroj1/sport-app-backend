# PostgreSQL local con bases lógicas separadas por dominio (infraestructura/02-entorno-local).
# Diferencia conocida frente a GCP: sin HA, una sola instancia y la misma identidad
# por dominio para aplicación y migración.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: POSTGRES_ADMIN_PASSWORD}
            - name: USUARIOS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: USUARIOS_DB_PASSWORD}
            - name: AFILIACION_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: AFILIACION_DB_PASSWORD}
            - name: SERVICIOS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: SERVICIOS_DB_PASSWORD}
            - name: ENTRENAMIENTOS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: ENTRENAMIENTOS_DB_PASSWORD}
            - name: EVENTOS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: sportapp-database, key: EVENTOS_DB_PASSWORD}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: init
          configMap: {name: postgres-init}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
