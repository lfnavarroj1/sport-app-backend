[project]
name = "sportapp-platform"
version = "0.1.0"
description = "Capacidades técnicas compartidas de SportApp. No contiene entidades ni reglas de negocio."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
