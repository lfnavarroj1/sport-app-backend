[project]
name = "events-management"
version = "0.1.0"
description = "SportApp - Eventos."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=50.0",
    "google-cloud-pubsub>=2.29",
    "sportapp-platform",
]

[tool.uv.sources]
sportapp-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
